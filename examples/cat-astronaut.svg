<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="svg-title">
  <title id="svg-title">Cat Astronaut Floating in Space</title>
  <defs>
    <!-- Space background -->
    <radialGradient id="spaceG" cx="0.3" cy="0.3" r="0.85" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#1a1145"/>
      <stop offset="30%" stop-color="#0f0a2e"/>
      <stop offset="60%" stop-color="#080620"/>
      <stop offset="100%" stop-color="#020114"/>
    </radialGradient>
    <!-- Nebula glow -->
    <radialGradient id="nebula1" cx="0.7" cy="0.6" r="0.4" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="0.2" cy="0.7" r="0.35" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Suit body gradient -->
    <radialGradient id="suitG" cx="0.4" cy="0.3" r="0.65" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Helmet visor gradient -->
    <radialGradient id="visorG" cx="0.35" cy="0.3" r="0.6" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="30%" stop-color="#22d3ee"/>
      <stop offset="60%" stop-color="#0891b2"/>
      <stop offset="85%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>

    <!-- Helmet rim metallic -->
    <linearGradient id="rimG" x1="0" y1="0" x2="0" y2="1" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Cat fur -->
    <radialGradient id="furG" cx="0.4" cy="0.35" r="0.6" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Backpack gradient -->
    <linearGradient id="packG" x1="0" y1="0" x2="0" y2="1" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Star glow filter -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Suit shadow filter -->
    <filter id="suitSh" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset in="b" dx="3" dy="5" result="o"/>
      <feFlood flood-color="#1a1a4e" flood-opacity="0.4" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Visor reflection filter -->
    <filter id="visorRef" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="800" height="600" fill="url(#spaceG)"/>
  <rect width="800" height="600" fill="url(#nebula1)"/>
  <rect width="800" height="600" fill="url(#nebula2)"/>

  <!-- Stars - tiny dots -->
  <g fill="white">
    <circle cx="50" cy="40" r="1" opacity="0.8"/>
    <circle cx="120" cy="90" r="0.7" opacity="0.5"/>
    <circle cx="200" cy="30" r="1.2" opacity="0.9"/>
    <circle cx="310" cy="70" r="0.6" opacity="0.4"/>
    <circle cx="450" cy="45" r="0.8" opacity="0.7"/>
    <circle cx="520" cy="100" r="1" opacity="0.6"/>
    <circle cx="630" cy="55" r="0.9" opacity="0.8"/>
    <circle cx="710" cy="35" r="0.7" opacity="0.5"/>
    <circle cx="760" cy="90" r="1.1" opacity="0.7"/>
    <circle cx="80" cy="180" r="0.6" opacity="0.4"/>
    <circle cx="160" cy="220" r="0.8" opacity="0.6"/>
    <circle cx="680" cy="200" r="0.9" opacity="0.5"/>
    <circle cx="740" cy="260" r="0.7" opacity="0.6"/>
    <circle cx="30" cy="320" r="1" opacity="0.5"/>
    <circle cx="100" cy="400" r="0.8" opacity="0.4"/>
    <circle cx="200" cy="500" r="0.7" opacity="0.5"/>
    <circle cx="650" cy="380" r="0.9" opacity="0.6"/>
    <circle cx="720" cy="450" r="0.6" opacity="0.4"/>
    <circle cx="580" cy="520" r="0.8" opacity="0.5"/>
    <circle cx="350" cy="550" r="0.7" opacity="0.3"/>
    <circle cx="490" cy="480" r="0.6" opacity="0.4"/>
    <circle cx="770" cy="540" r="1" opacity="0.5"/>
    <circle cx="40" cy="530" r="0.7" opacity="0.3"/>
    <circle cx="280" cy="150" r="0.5" opacity="0.4"/>
    <circle cx="560" cy="170" r="0.6" opacity="0.3"/>
  </g>

  <!-- Twinkling stars (brighter, with glow) -->
  <g filter="url(#starGlow)">
    <circle cx="150" cy="120" r="2" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="80" r="2.5" fill="#fde68a" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="320" r="2" fill="#bfdbfe" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="450" r="1.8" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="50" r="2.2" fill="#fcd34d" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="500" r="1.5" fill="#c4b5fd" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Crescent moon -->
  <g transform="translate(60, 470)">
    <circle cx="0" cy="0" r="14" fill="#e2e8f0"/>
    <circle cx="5" cy="-3" r="11" fill="#0f0a2e"/>
    <circle cx="-5" cy="2" r="2" fill="#cbd5e1" opacity="0.3"/>
    <circle cx="-3" cy="7" r="1.5" fill="#cbd5e1" opacity="0.2"/>
  </g>

  <!-- Earth (partial, bottom-left) -->
  <g>
    <clipPath id="earthClip"><circle cx="120" cy="590" r="85"/></clipPath>
    <circle cx="120" cy="590" r="85" fill="#1e40af"/>
    <g clip-path="url(#earthClip)">
      <ellipse cx="90" cy="570" rx="40" ry="22" fill="#22c55e" opacity="0.6"/>
      <ellipse cx="150" cy="595" rx="28" ry="18" fill="#22c55e" opacity="0.5"/>
      <circle cx="120" cy="590" r="85" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.3"/>
      <circle cx="120" cy="590" r="88" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.15"/>
      <ellipse cx="100" cy="578" rx="30" ry="5" fill="white" opacity="0.12"/>
    </g>
  </g>

  <!-- Distant planet with ring -->
  <g>
    <circle cx="680" cy="480" r="35" fill="#1e1b4b" opacity="0.5"/>
    <ellipse cx="680" cy="480" rx="55" ry="8" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.25" transform="rotate(-15, 680, 480)"/>
  </g>

  <!-- 4-point star decorations -->
  <g fill="white" opacity="0.6">
    <path d="M260,100 L262,95 L264,100 L269,102 L264,104 L262,109 L260,104 L255,102Z"/>
    <path d="M730,170 L731.5,166 L733,170 L737,171.5 L733,173 L731.5,177 L730,173 L726,171.5Z" opacity="0.4"/>
    <path d="M480,540 L481.5,536 L483,540 L487,541.5 L483,543 L481.5,547 L480,543 L476,541.5Z" opacity="0.3"/>
  </g>

  <!-- ============ CAT ASTRONAUT (floating, slight tilt) ============ -->
  <g transform="translate(400, 300) rotate(-8)" filter="url(#suitSh)">
    <!-- Floating animation (additive) -->
    <animateTransform attributeName="transform" type="translate" values="0,0;2,-6;0,0;-2,6;0,0" dur="6s" repeatCount="indefinite" additive="sum"/>
    <!-- The whole cat is centered at 0,0 -->

    <!-- === BACKPACK (behind body) === -->
    <rect x="15" y="-50" width="55" height="80" rx="12" fill="url(#packG)"/>
    <rect x="22" y="-42" width="14" height="10" rx="3" fill="#475569"/>
    <rect x="42" y="-42" width="14" height="10" rx="3" fill="#475569"/>
    <!-- Backpack tubes -->
    <line x1="25" y1="-50" x2="15" y2="-70" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="-50" x2="60" y2="-70" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <!-- Backpack lights -->
    <circle cx="30" cy="-30" r="3" fill="#22c55e" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="-30" r="3" fill="#ef4444" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- === LEGS (behind body) === -->
    <!-- Left leg -->
    <line x1="-20" y1="55" x2="-35" y2="110" stroke="#cbd5e1" stroke-width="24" stroke-linecap="round"/>
    <line x1="-35" y1="110" x2="-30" y2="155" stroke="#cbd5e1" stroke-width="22" stroke-linecap="round"/>
    <circle cx="-35" cy="110" r="12" fill="#cbd5e1"/>
    <!-- Boot -->
    <ellipse cx="-30" cy="160" rx="18" ry="12" fill="#475569"/>
    <ellipse cx="-30" cy="157" rx="16" ry="9" fill="#64748b"/>

    <!-- Right leg -->
    <line x1="20" y1="55" x2="40" y2="105" stroke="#e2e8f0" stroke-width="24" stroke-linecap="round"/>
    <line x1="40" y1="105" x2="50" y2="148" stroke="#e2e8f0" stroke-width="22" stroke-linecap="round"/>
    <circle cx="40" cy="105" r="12" fill="#e2e8f0"/>
    <!-- Boot -->
    <ellipse cx="50" cy="153" rx="18" ry="12" fill="#475569"/>
    <ellipse cx="50" cy="150" rx="16" ry="9" fill="#64748b"/>

    <!-- === TORSO (suit body) === -->
    <ellipse cx="0" cy="10" rx="55" ry="65" fill="url(#suitG)"/>

    <!-- Suit chest panel -->
    <rect x="-25" y="-25" width="50" height="40" rx="8" fill="#94a3b8" opacity="0.3"/>
    <!-- Chest badge -->
    <circle cx="-12" cy="-10" r="7" fill="#1e40af" opacity="0.7"/>
    <text x="-12" y="-7" text-anchor="middle" font-size="7" fill="white" font-weight="bold">★</text>
    <!-- Suit seam lines -->
    <line x1="0" y1="-30" x2="0" y2="50" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
    <ellipse cx="0" cy="35" rx="30" ry="1" fill="#94a3b8" opacity="0.3"/>

    <!-- === ARMS === -->
    <!-- Left arm (waving!) -->
    <line x1="-45" y1="-15" x2="-85" y2="-50" stroke="#cbd5e1" stroke-width="20" stroke-linecap="round"/>
    <line x1="-85" y1="-50" x2="-105" y2="-85" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-85" cy="-50" r="10" fill="#cbd5e1"/>
    <!-- Glove -->
    <circle cx="-105" cy="-88" r="14" fill="#475569"/>
    <circle cx="-105" cy="-88" r="11" fill="#64748b"/>

    <!-- Right arm (relaxed, floating) -->
    <line x1="45" y1="-10" x2="80" y2="20" stroke="#e2e8f0" stroke-width="20" stroke-linecap="round"/>
    <line x1="80" y1="20" x2="100" y2="55" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
    <circle cx="80" cy="20" r="10" fill="#e2e8f0"/>
    <!-- Glove -->
    <circle cx="100" cy="58" r="14" fill="#475569"/>
    <circle cx="100" cy="58" r="11" fill="#64748b"/>

    <!-- === HELMET === -->
    <!-- Helmet outer shell -->
    <circle cx="0" cy="-65" r="52" fill="#e2e8f0"/>
    <circle cx="0" cy="-65" r="50" fill="#cbd5e1"/>
    <!-- Helmet rim -->
    <circle cx="0" cy="-65" r="48" fill="none" stroke="url(#rimG)" stroke-width="3"/>

    <!-- Visor (front glass) -->
    <ellipse cx="-3" cy="-62" rx="38" ry="36" fill="url(#visorG)" opacity="0.85"/>

    <!-- Visor reflection -->
    <ellipse cx="-15" cy="-78" rx="15" ry="10" fill="white" opacity="0.18" transform="rotate(-20, -15, -78)"/>
    <ellipse cx="10" cy="-85" rx="6" ry="4" fill="white" opacity="0.12" transform="rotate(-15, 10, -85)"/>
    <!-- Star reflections in visor -->
    <circle cx="-22" cy="-72" r="1.2" fill="white" opacity="0.4"/>
    <circle cx="18" cy="-75" r="0.8" fill="white" opacity="0.3"/>
    <circle cx="-8" cy="-88" r="1" fill="#fde68a" opacity="0.35"/>

    <!-- === CAT FACE (inside helmet) === -->
    <g>
      <!-- Cat head -->
      <ellipse cx="-2" cy="-62" rx="30" ry="28" fill="url(#furG)"/>

      <!-- Cat ears (poking up inside helmet) -->
      <polygon points="-22,-82 -15,-100 -6,-82" fill="#f97316"/>
      <polygon points="-20,-83 -15,-96 -8,-83" fill="#fed7aa"/>
      <polygon points="6,-82 15,-100 22,-82" fill="#f97316"/>
      <polygon points="8,-83 15,-96 20,-83" fill="#fed7aa"/>

      <!-- White muzzle -->
      <ellipse cx="-2" cy="-52" rx="18" ry="14" fill="#fff7ed"/>

      <!-- Eyes (big, cute, amazed) -->
      <ellipse cx="-14" cy="-65" rx="9" ry="10" fill="white"/>
      <ellipse cx="10" cy="-65" rx="9" ry="10" fill="white"/>
      <!-- Pupils (looking up at stars) -->
      <circle cx="-13" cy="-67" r="5.5" fill="#1e293b"/>
      <circle cx="11" cy="-67" r="5.5" fill="#1e293b"/>
      <!-- Eye shine -->
      <circle cx="-10" cy="-70" r="2.5" fill="white"/>
      <circle cx="14" cy="-70" r="2.5" fill="white"/>
      <circle cx="-15" cy="-64" r="1.2" fill="white"/>
      <circle cx="9" cy="-64" r="1.2" fill="white"/>

      <!-- Nose -->
      <ellipse cx="-2" cy="-53" rx="4" ry="2.5" fill="#f472b6"/>
      <ellipse cx="-3" cy="-54" rx="1.5" ry="1" fill="#f9a8d4" opacity="0.5"/>

      <!-- Mouth (amazed smile) -->
      <path d="M-6,-50 Q-2,-46 2,-50" fill="none" stroke="#9a3412" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Open mouth (little o of wonder) -->
      <ellipse cx="-2" cy="-47" rx="3.5" ry="2.5" fill="#9a3412" opacity="0.5"/>

      <!-- Whiskers -->
      <g stroke="#d97706" stroke-width="0.8" opacity="0.5">
        <line x1="-18" y1="-55" x2="-32" y2="-58"/>
        <line x1="-18" y1="-52" x2="-33" y2="-51"/>
        <line x1="14" y1="-55" x2="28" y2="-58"/>
        <line x1="14" y1="-52" x2="29" y2="-51"/>
      </g>

      <!-- Tabby stripes on forehead -->
      <g stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
        <line x1="-10" y1="-78" x2="-8" y2="-72"/>
        <line x1="-2" y1="-80" x2="-2" y2="-73"/>
        <line x1="6" y1="-78" x2="4" y2="-72"/>
      </g>
    </g>

    <!-- Helmet antenna -->
    <line x1="0" y1="-117" x2="0" y2="-130" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-133" r="5" fill="#ef4444">
      <animate attributeName="r" values="5;6;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-133" r="8" fill="#ef4444" opacity="0.2">
      <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- === TAIL (poking out of suit) === -->
    <path d="M30,50 Q60,45 70,25 Q78,10 72,0 Q68,-5 60,0" 
          fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
    <!-- Tail white tip -->
    <path d="M68,5 Q72,-5 60,0" fill="none" stroke="#fff7ed" stroke-width="7" stroke-linecap="round"/>

    <!-- Floating tether cord -->
    <path d="M60,-40 Q100,-60 130,-40 Q160,-20 150,10 Q145,30 160,50" 
          fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.5"/>
  </g>

  <!-- ============ FLOATING OBJECTS ============ -->
  <!-- Little fish toy (cat toy floating in space!) -->
  <g transform="translate(220, 180) rotate(15)">
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#f472b6" opacity="0.7"/>
    <polygon points="15,-2 25,-8 25,8 15,2" fill="#f472b6" opacity="0.7"/>
    <circle cx="-5" cy="-2" r="2" fill="white" opacity="0.8"/>
    <animate attributeName="transform" attributeType="XML" type="translate" values="220,180;225,175;220,180" dur="5s" repeatCount="indefinite" additive="replace"/>
  </g>

  <!-- Floating yarn ball -->
  <g>
    <circle cx="590" cy="220" r="12" fill="#a855f7" opacity="0.6">
      <animate attributeName="cy" values="220;215;220" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M583,215 Q590,220 597,215 Q590,225 583,215" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <!-- Yarn string trailing -->
    <path d="M590,232 Q600,245 595,260 Q588,275 595,285" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- Floating gentle animation for whole cat -->
  <style>
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <!-- Small shooting star -->
  <line x1="100" y1="50" x2="130" y2="60" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="x1" values="100;200;300" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="50;80;110" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="130;230;330" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="60;90;120" dur="3s" begin="2s" repeatCount="indefinite"/>
  </line>
</svg>
